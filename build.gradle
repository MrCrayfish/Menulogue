buildscript {
    dependencies {
        classpath "commons-io:commons-io:2.20.0"
    }
}

plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
	id 'signing'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = "${project.mod_id}-fabric"
version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

configurations {
	implementation.extendsFrom library
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def props = [
		"mod_id": mod_id,
		"mod_name": mod_name,
		"mod_version": mod_version,
		"minecraft_version": minecraft_version
	]
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.getRelease().set(21)
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE_MENULOGUE") {
		rename { "LICENSE_${project.mod_id}"}
	}
	from("LICENSE_MODMENU") {
		rename { "LICENSE_modmenu"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId project.group
			artifactId project.archivesBaseName
			version project.version

			artifact remapJar
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}

			pom.withXml {
				def depsNode = asNode().appendNode('dependencies')
				[this.configurations.library].each {
					it.allDependencies.each {
						def depNode = depsNode.appendNode('dependency')
						depNode.appendNode('groupId', it.group)
						depNode.appendNode('artifactId', it.name)
						depNode.appendNode('version', it.version)
					}
				}
			}
		}
	}

	repositories {
		if (System.getenv("CI")) {
			maven {
				name = "GitHubPackages"
				url = "https://maven.pkg.github.com/MrCrayfish/Maven"
				credentials {
					username = project.findProperty("gpr.user") ?: System.getenv("GPR_USER")
					password = project.findProperty("gpr.key") ?: System.getenv("GPR_KEY")
				}
			}
		} else if(System.getenv("LOCAL_MAVEN")) {
			maven {
				url "file://" + System.getenv("LOCAL_MAVEN")
			}
		}
	}
}

signing {
	if (System.getenv("SIGNING_KEY") && System.getenv("SIGNING_PASSPHRASE")) {
		def signingKey = System.getenv("SIGNING_KEY")
		def signingPassword = System.getenv("SIGNING_PASSPHRASE")
		useInMemoryPgpKeys(signingKey, signingPassword)
		sign publishing.publications.mavenJava
	}
}

tasks.register("signJar") {
    dependsOn remapJar
    onlyIf {
        findProperty('keyStore') || System.getenv("KEYSTORE")
    }
    doLast {
        def unsignedJar = remapJar.archiveFile.get().asFile
        def name = org.apache.commons.io.FilenameUtils.removeExtension(unsignedJar.getName())
        def signedJar  = layout.buildDirectory.file("libs/%s-signed.jar".formatted(name)).get().asFile
        def signingKeyAlias = findProperty('keyStoreAlias') ?: System.getenv("KEYSTORE_ALIAS")
        def signingKeystore = findProperty('keyStore') ?: System.getenv("KEYSTORE")
        def signingPassword = findProperty('keyStorePass') ?: System.getenv("KEYSTORE_PASS")
        ant.signjar(
            jar: unsignedJar,
            signedJar: signedJar,
            alias: signingKeyAlias,
            keyStore: signingKeystore,
            storePass: signingPassword,
            storetype: 'jks'
        )
        println "Signed jar created at: $signedJar"
    }
}

build.dependsOn signJar
